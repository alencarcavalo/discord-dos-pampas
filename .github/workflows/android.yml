name: Gerar app do Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Criar projeto Android
        run: |
          mkdir -p mobile/www
          cd mobile
          cat > package.json <<'EOF'
          {
            "name": "pampa-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            },
            "devDependencies": { "@capacitor/assets": "^3.0.5" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.pampas.discord",
            "appName": "Pampa Chat",
            "webDir": "www",
            "server": {
              "url": "https://discord-dos-pampas.onrender.com/",
              "cleartext": false,
              "allowNavigation": ["discord-dos-pampas.onrender.com"]
            }
          }
          EOF
          echo '<!doctype html><meta charset="utf-8"><title>Pampa Chat</title><p>Abrindo...</p>' > www/index.html
          npm install
          npx cap add android
      - name: Icone do app
        working-directory: mobile
        continue-on-error: true
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p resources
          convert ../public/icon-512.png -resize 1024x1024 resources/icon-only.png
          cp resources/icon-only.png resources/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#101821'
      - name: Permissoes de microfone e camera
        working-directory: mobile
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $f
      - name: Gerar APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Pampa-Chat.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Pampa Chat Android (APK)
          prerelease: true
          files: Pampa-Chat.apk
