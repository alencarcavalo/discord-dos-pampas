<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord dos Pampas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1e1f22">
<style>
:root{--rail:#1e1f22;--side:#2b2d31;--main:#313338;--input:#383a40;--hover:#35373c;--txt:#dbdee1;--mut:#949ba4;--blur:#5865f2;--verde:#23a559;--verm:#f23f43;--pampa:#c8372d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--main);color:var(--txt);font:15px/1.4 "gg sans","Segoe UI",system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:4px;background:transparent}
input{background:var(--input);border:0;border-radius:6px;padding:.7rem .8rem;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--blur);outline-offset:1px}
small{color:var(--mut)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.av.s{width:24px;height:24px;font-size:.75rem}

#login{min-height:100%;display:grid;place-items:center;background:var(--rail);padding:1rem}
#loginc{background:var(--main);border-radius:8px;padding:2rem;width:100%;max-width:440px;display:grid;gap:1rem;text-align:center;box-shadow:0 2px 10px #0006}
#loginc .logo{width:72px;height:72px;margin:0 auto;font-size:2rem;background:var(--pampa)}
#loginc h1{margin:0;font-size:1.5rem}
#loginc label{text-align:left;display:grid;gap:.4rem;color:var(--mut);font-size:.8rem;font-weight:700;text-transform:uppercase}
.go{background:var(--blur);color:#fff;padding:.75rem;font-weight:600}
.go:hover{background:#4752c4}
#instalar{background:var(--input);padding:.7rem}
#erro{color:var(--verm);min-height:1.2em}

#app{height:100%;display:grid;grid-template-columns:72px 240px 1fr;grid-template-rows:1fr}
#rail{background:var(--rail);padding:12px 0;display:flex;flex-direction:column;align-items:center}
#rail .av{width:48px;height:48px;background:var(--pampa);font-size:1.3rem;border-radius:16px;position:relative}
#rail .av::before{content:"";position:absolute;left:-12px;top:12px;width:4px;height:24px;background:#fff;border-radius:0 4px 4px 0}
#side{background:var(--side);display:flex;flex-direction:column;min-height:0}
#sname{padding:0 16px;height:48px;display:flex;align-items:center;font-weight:700;border-bottom:1px solid #1f2023;box-shadow:0 1px 0 #0002}
#chans{flex:1;overflow:auto;padding:8px}
#chans h3{margin:12px 8px 4px;font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.02em}
.ch{display:flex;align-items:center;gap:.5rem;width:100%;padding:6px 8px;color:var(--mut);text-align:left;border-radius:4px}
.ch:hover{background:var(--hover);color:var(--txt)}
.ch.on{background:#404249;color:#fff}
.mem{display:flex;align-items:center;gap:.5rem;padding:3px 8px 3px 32px;color:var(--mut)}
#vc{background:#232428;padding:8px 10px;border-top:1px solid #1f2023}
#vc b{color:var(--verde);display:block;font-size:.85rem}
#vcn{display:block;margin-bottom:6px}
.vb{display:flex;gap:6px}
.vb button,#bMic{background:var(--input);padding:6px 10px;border-radius:6px}
.vb button{flex:1}
.vb button:hover,#bMic:hover{background:#4e5058}
.vb button.on{background:var(--verde)}
.vb #bSair:hover{background:var(--verm)}
#bMic.off{color:var(--verm)}
#me{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#232428}
#me div:nth-child(2){flex:1;min-width:0;line-height:1.2}
#meN{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#main{display:grid;grid-template-columns:1fr 320px;grid-template-rows:48px 1fr;min-height:0;min-width:0}
#top{grid-column:1/3;display:flex;align-items:center;padding:0 16px;font-weight:700;border-bottom:1px solid #26272b;box-shadow:0 1px 0 #0002}
#stage{padding:12px;overflow:auto;min-height:0}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tile{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.tile video{width:100%;height:100%;object-fit:contain}
.tile span{position:absolute;left:8px;bottom:8px;background:#000a;padding:2px 8px;border-radius:4px;font-size:.85rem}
#vazio{color:var(--mut);text-align:center;padding:12vh 1rem}
#vazio b{display:block;color:var(--txt);font-size:1.2rem;margin-bottom:.4rem}
#chatw{border-left:1px solid #26272b;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:12px}
.m p{margin:0;overflow-wrap:anywhere}
.m b{margin-right:.4rem}
.sis{color:var(--mut);font-size:.85rem;font-style:italic}
#chat{padding:0 16px 16px}
@media(max-width:820px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 #rail{display:none}
 #side{max-height:46vh}
 #main{grid-template-columns:1fr;grid-template-rows:48px 1fr 240px}
 #top{grid-column:1}
 #chatw{border-left:0;border-top:1px solid #26272b}
}
</style>
</head>
<body>
<form id="login">
  <div id="loginc">
    <div class="av logo">P</div>
    <h1>Discord dos Pampas</h1>
    <small>Voz, câmera, tela e chat pra turma.</small>
    <label>Como a turma te chama?<input id="nome" maxlength="24" required autocomplete="nickname"></label>
    <button class="go">Entrar</button>
    <button type="button" id="instalar" hidden>Instalar como app</button>
    <div id="erro" role="alert"></div>
  </div>
</form>

<div id="app" hidden>
  <nav id="rail"><div class="av" title="Discord dos Pampas">P</div></nav>
  <section id="side">
    <div id="sname">Discord dos Pampas</div>
    <div id="chans"></div>
    <div id="vc" hidden>
      <b>Voz conectada</b><small id="vcn"></small>
      <div class="vb">
        <button id="bCam" title="Câmera">📷</button>
        <button id="bTela" title="Compartilhar tela">🖥️</button>
        <button id="bSair" title="Desconectar">📞</button>
      </div>
    </div>
    <div id="me"><div class="av" id="meav"></div><div><b id="meN"></b><small>Online</small></div><button id="bMic" title="Microfone">🎤</button></div>
  </section>
  <section id="main">
    <div id="top"></div>
    <div id="stage"><div id="grid"></div><div id="vazio"></div></div>
    <div id="chatw">
      <div id="msgs" aria-live="polite"></div>
      <form id="chat"><input id="txt" maxlength="500" placeholder="Conversar na sala" autocomplete="off"></form>
    </div>
  </section>
  <div id="audios" hidden></div>
</div>

<script>
const $ = s => document.querySelector(s);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
let instPrompt;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); instPrompt = e; $('#instalar').hidden = false; });
$('#instalar').onclick = async () => { if (!instPrompt) return; instPrompt.prompt(); await instPrompt.userChoice; instPrompt = null; $('#instalar').hidden = true; };

const CHANNELS = [['geral', 'Geral'], ['jogatina', 'Jogatina'], ['resenha', 'Resenha'], ['sala-4', 'Sala 4']];
const S = { mic: new MediaStream(), cam: new MediaStream(), screen: new MediaStream() };
let ws, me, ICE = [], peers = {}, names = {}, myName = '', cur = null, lob = {}, micTried = false;
const send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));
const COLORS = ['#5865f2', '#23a559', '#c27c0e', '#eb459e', '#f23f43', '#0b8fd6'];
const colorOf = n => COLORS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
function avatar(n, small) {
  const d = document.createElement('div'); d.className = 'av' + (small ? ' s' : '');
  d.style.background = colorOf(n); d.textContent = (n[0] || '?').toUpperCase(); return d;
}
const label = id => (CHANNELS.find(c => c[0] === id) || [0, id])[1];

function note(t) {
  if ($('#app').hidden) { $('#erro').textContent = t; return; }
  const p = document.createElement('p'); p.className = 'sis'; p.textContent = t; $('#msgs').append(p); $('#msgs').scrollTop = 1e9;
}
function emptyCheck() {
  const v = $('#vazio'); v.hidden = $('#grid').children.length > 0; v.replaceChildren();
  const b = document.createElement('b'), t = document.createElement('span');
  if (cur) { b.textContent = 'Você está em ' + label(cur); t.textContent = 'Ligue a câmera ou compartilhe a tela.'; }
  else { b.textContent = 'Bem-vindo, ' + myName; t.textContent = 'Escolha um canal de voz na esquerda para entrar.'; }
  v.append(b, t);
}
function renderTop() {
  $('#top').textContent = cur ? '🔊 ' + label(cur) : 'Discord dos Pampas';
  $('#vc').hidden = !cur; $('#vcn').textContent = cur ? label(cur) + ' / Pampas' : '';
  $('#txt').placeholder = cur ? 'Conversar em ' + label(cur) : 'Entre num canal de voz';
  $('#txt').disabled = !cur; emptyCheck();
}
function renderChans() {
  const box = $('#chans'); box.replaceChildren();
  const h = document.createElement('h3'); h.textContent = 'Canais de voz'; box.append(h);
  CHANNELS.forEach(([id, nome]) => {
    const b = document.createElement('button'); b.className = 'ch' + (cur === id ? ' on' : ''); b.textContent = '🔊 ' + nome;
    b.onclick = () => joinCh(id); box.append(b);
    (lob[id] || []).forEach(p => {
      const m = document.createElement('div'); m.className = 'mem';
      const t = document.createElement('span'); t.textContent = p.name + (p.id === me ? ' (você)' : '');
      m.append(avatar(p.name, true), t); box.append(m);
    });
  });
}

$('#login').onsubmit = e => {
  e.preventDefault();
  myName = $('#nome').value.trim() || 'Guri';
  try { localStorage.setItem('pampas-nome', myName); } catch {}
  fetch('/ice').then(r => r.json()).then(j => ICE = j).catch(() => {});
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send({ type: 'hello', name: myName });
  ws.onmessage = ev => handle(JSON.parse(ev.data));
  ws.onclose = () => note('Conexão perdida. Recarregue o app.');
};
try { $('#nome').value = localStorage.getItem('pampas-nome') || ''; } catch {}

async function joinCh(id) {
  if (cur === id) return;
  if (!micTried) {
    micTried = true;
    try {
      const m = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      m.getAudioTracks().forEach(t => S.mic.addTrack(t));
    } catch { note('Sem microfone: você vai só ouvir.'); $('#bMic').disabled = true; }
  }
  if (cur) dropAll();
  send({ type: 'join', room: id });
}
function dropAll() {
  Object.keys(peers).forEach(dropPeer); dropLocal('cam'); dropLocal('screen');
  press($('#bCam'), false); press($('#bTela'), false);
  names = {}; $('#msgs').replaceChildren(); cur = null;
}

function handle(m) {
  if (m.type === 'hello-ok') {
    me = m.id; $('#login').hidden = true; $('#app').hidden = false;
    $('#meN').textContent = myName; $('#meav').replaceChildren(); $('#meav').style.background = colorOf(myName); $('#meav').textContent = myName[0].toUpperCase();
    renderChans(); renderTop();
  } else if (m.type === 'lobby') { lob = m.rooms; renderChans(); }
  else if (m.type === 'full') note('Esse canal está cheio (máximo de 8 pessoas).');
  else if (m.type === 'joined') {
    cur = m.room; m.peers.forEach(p => { names[p.id] = p.name; makePeer(p.id); });
    renderChans(); renderTop(); note('Você entrou em ' + label(cur) + '.');
  } else if (m.type === 'peer-join') { names[m.id] = m.name; note(m.name + ' entrou.'); }
  else if (m.type === 'peer-leave') { note((names[m.id] || 'Alguém') + ' saiu.'); dropPeer(m.id); delete names[m.id]; }
  else if (m.type === 'signal') onSignal(m.from, m.data);
  else if (m.type === 'chat') {
    const d = document.createElement('div'), p = document.createElement('p'), b = document.createElement('b'); d.className = 'm';
    b.textContent = m.from; p.append(b, m.text); d.append(avatar(m.from), p); $('#msgs').append(d); $('#msgs').scrollTop = 1e9;
  }
}

function tile(key, lbl, stream) {
  if (document.getElementById('t-' + key)) return;
  const d = document.createElement('div'); d.className = 'tile'; d.id = 't-' + key;
  const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.muted = true; v.srcObject = stream;
  const l = document.createElement('span'); l.textContent = lbl;
  d.append(v, l); $('#grid').append(d); emptyCheck();
}
function rmTile(key) { document.getElementById('t-' + key)?.remove(); emptyCheck(); }

function makePeer(id) {
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const p = peers[id] = { pc, polite: me < id, making: false, ignore: false, snd: {} };
  pc.onnegotiationneeded = async () => {
    try { p.making = true; await pc.setLocalDescription(); send({ type: 'signal', to: id, data: { description: pc.localDescription } }); }
    catch (e) { console.error(e); } finally { p.making = false; }
  };
  pc.onicecandidate = e => e.candidate && send({ type: 'signal', to: id, data: { candidate: e.candidate } });
  pc.ontrack = e => onTrack(id, e);
  for (const k in S) S[k].getTracks().forEach(t => (p.snd[k] ||= []).push(pc.addTrack(t, S[k])));
  if (!S.mic.getTracks().length) pc.addTransceiver('audio', { direction: 'recvonly' });
  return p;
}
async function onSignal(from, data) {
  if (!cur) return;
  const p = peers[from] || makePeer(from);
  try {
    if (data.description) {
      const d = data.description;
      const clash = d.type === 'offer' && (p.making || p.pc.signalingState !== 'stable');
      p.ignore = !p.polite && clash;
      if (p.ignore) return;
      await p.pc.setRemoteDescription(d);
      if (d.type === 'offer') { await p.pc.setLocalDescription(); send({ type: 'signal', to: from, data: { description: p.pc.localDescription } }); }
    } else if (data.candidate) {
      try { await p.pc.addIceCandidate(data.candidate); } catch (e) { if (!p.ignore) throw e; }
    }
  } catch (e) { console.error(e); }
}
function onTrack(id, e) {
  const st = e.streams[0]; if (!st) return;
  if (e.track.kind === 'audio') {
    if (!document.getElementById('a-' + id + '-' + st.id)) {
      const a = new Audio(); a.id = 'a-' + id + '-' + st.id; a.autoplay = true; a.srcObject = st; $('#audios').append(a);
    }
  } else tile(id + ':' + st.id, names[id] || '?', st);
  st.onremovetrack = () => {
    if (!st.getVideoTracks().length) rmTile(id + ':' + st.id);
    if (!st.getAudioTracks().length) document.getElementById('a-' + id + '-' + st.id)?.remove();
  };
}
function dropPeer(id) {
  peers[id]?.pc.close(); delete peers[id];
  document.querySelectorAll('[id^="t-' + id + ':"],[id^="a-' + id + '-"]').forEach(n => n.remove());
  emptyCheck();
}

function addLocal(kind, track) {
  S[kind].addTrack(track);
  for (const p of Object.values(peers)) (p.snd[kind] ||= []).push(p.pc.addTrack(track, S[kind]));
}
function dropLocal(kind) {
  S[kind].getTracks().forEach(t => { t.stop(); S[kind].removeTrack(t); });
  for (const p of Object.values(peers)) { (p.snd[kind] || []).forEach(s => p.pc.removeTrack(s)); p.snd[kind] = []; }
  rmTile('me:' + kind);
}
const press = (b, on) => b.classList.toggle('on', on);

$('#bMic').onclick = e => {
  const t = S.mic.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; e.currentTarget.textContent = t.enabled ? '🎤' : '🔇'; e.currentTarget.classList.toggle('off', !t.enabled);
};
$('#bCam').onclick = async e => {
  const b = e.currentTarget;
  if (S.cam.getTracks().length) { dropLocal('cam'); return press(b, false); }
  try {
    const m = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    addLocal('cam', m.getVideoTracks()[0]); tile('me:cam', 'Você', S.cam); press(b, true);
  } catch { note('Não consegui abrir a câmera. Confira a permissão do navegador.'); }
};
$('#bTela').onclick = async e => {
  const b = e.currentTarget;
  if (S.screen.getTracks().length) { dropLocal('screen'); return press(b, false); }
  try {
    const m = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    m.getTracks().forEach(t => addLocal('screen', t));
    m.getVideoTracks()[0].onended = () => { dropLocal('screen'); press(b, false); };
    tile('me:screen', 'Sua tela', S.screen); press(b, true);
  } catch { note('Compartilhamento de tela cancelado.'); }
};
$('#bSair').onclick = () => { dropAll(); send({ type: 'leave' }); renderChans(); renderTop(); };
$('#chat').onsubmit = e => { e.preventDefault(); const t = $('#txt').value.trim(); if (t) send({ type: 'chat', text: t }); $('#txt').value = ''; };
</script>
</body>
</html>
