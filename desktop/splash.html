<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Pampa Chat</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--blur:#5865f2;--pampa:#c8372d}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"gg sans","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#splash{display:grid;position:fixed;inset:18px;border-radius:28px;place-items:center;overflow:hidden;-webkit-app-region:drag;box-shadow:0 12px 40px #000a,0 0 0 1px #ffffff14 inset;background:#0d0a14;color:#fff;transition:opacity .6s ease,transform .6s ease,filter .6s ease}
#splash{--rsv:#12a94a;--rsr:#e8141f;--rsa:#ffd100}
#splash::before{content:"";position:absolute;inset:-35%;background:linear-gradient(118deg,var(--rsv) 0 34%,var(--rsr) 34% 66%,var(--rsa) 66% 100%);filter:blur(46px) saturate(1.1);opacity:.55;animation:spWave 9s ease-in-out infinite alternate}
#splash::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#0d0a14e6 0,#0d0a14b0 36%,#0d0a1400 80%);pointer-events:none}
#splash .sp{position:relative;z-index:1;display:grid;justify-items:center;gap:22px}
#splash .lg{position:relative;width:150px;height:150px;display:grid;place-items:center}
#splash .lg img{width:112px;height:112px;object-fit:contain;position:relative;z-index:2;animation:spPop .9s cubic-bezier(.2,1.3,.4,1) both,spFloat 3s ease-in-out .9s infinite}
#splash .glow{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,#ffd10088,#e8141f33 46%,transparent 68%);animation:spPulse 2.2s ease-in-out infinite}
#splash .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 38%,var(--rsv) 52%,var(--rsa) 74%,var(--rsr) 92%,#fff 100%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 65%);mask:radial-gradient(circle,transparent 63%,#000 65%);animation:spSpin 1.5s linear infinite,spFade .5s .2s both}
#splash h1{margin:0;font-size:1.9rem;letter-spacing:.01em;display:flex;overflow:hidden;padding:3px 0}
#splash h1 span{display:inline-block;transform:translateY(115%);opacity:0;animation:spRise .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(.55s + var(--i)*.045s)}
#splash h1 span.w{width:.32em}
#splash .bar{width:190px;height:3px;border-radius:3px;background:#ffffff1f;overflow:hidden;opacity:0;animation:spFade .5s 1.2s both}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--rsv),var(--rsa),var(--rsr));animation:spBar 1.2s ease-in-out infinite}
#splash .cap{color:#f1e6c8;font-size:.9rem;min-height:1.2em;opacity:0;animation:spFade .5s 1.3s both;text-align:center;padding:0 16px}
#splash .cap.dots::after{content:"";display:inline-block;width:1.3em;text-align:left;animation:spDots 1.2s steps(1) infinite}
#splash .pt{position:absolute;z-index:1;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--rsa);box-shadow:0 0 8px 2px #ffb30088;opacity:0;animation:spEmber var(--d) linear var(--w) infinite}
#splash .pt:nth-child(3n){background:#ff7a1a;box-shadow:0 0 8px 2px #ff7a1a88}
#splash .pt:nth-child(3n+1){background:var(--rsr);box-shadow:0 0 8px 2px #e8141f88}
#splash.out{opacity:0;transform:scale(1.08);filter:blur(6px);pointer-events:none}
@keyframes spPop{from{opacity:0;transform:scale(.4) rotate(-12deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes spFloat{50%{transform:translateY(-7px)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@keyframes spPulse{50%{transform:scale(1.14);opacity:.65}}
@keyframes spRise{to{transform:none;opacity:1}}
@keyframes spDrift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes spBar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes spDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes spEmber{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:.95}50%{transform:translate(18px,-55vh) scale(.8)}100%{transform:translate(-12px,-105vh) scale(.3);opacity:0}}
@keyframes spWave{from{transform:rotate(-5deg) scale(1.05) translate(-3%,2%)}to{transform:rotate(5deg) scale(1.15) translate(3%,-2%)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash::before,#splash::after{animation:none!important}#splash h1 span,#splash .cap,#splash .bar{opacity:1;transform:none}#splash .pt{display:none}}
</style></head><body>
<div id="splash" aria-live="polite">
  <i class="pt" style="--x:8%;--s:5px;--d:9.0s;--w:0.0s"></i><i class="pt" style="--x:21%;--s:3px;--d:7.0s;--w:2.2s"></i><i class="pt" style="--x:34%;--s:6px;--d:11.0s;--w:0.8s"></i><i class="pt" style="--x:47%;--s:4px;--d:8.0s;--w:3.4s"></i><i class="pt" style="--x:60%;--s:5px;--d:10.0s;--w:1.5s"></i><i class="pt" style="--x:73%;--s:3px;--d:7.5s;--w:4.1s"></i><i class="pt" style="--x:86%;--s:6px;--d:12.0s;--w:0.3s"></i><i class="pt" style="--x:94%;--s:4px;--d:9.5s;--w:2.8s"></i><i class="pt" style="--x:15%;--s:4px;--d:10.5s;--w:5.2s"></i><i class="pt" style="--x:67%;--s:3px;--d:8.5s;--w:6.0s"></i>
  <div class="sp">
    <div class="lg"><div class="glow"></div><div class="ring"></div><img src="build/logo.png" alt=""></div>
    <h1 aria-label="Pampa Chat"><span style="--i:0">P</span><span style="--i:1">a</span><span style="--i:2">m</span><span style="--i:3">p</span><span style="--i:4">a</span><span class="w" style="--i:5"></span><span style="--i:6">C</span><span style="--i:7">h</span><span style="--i:8">a</span><span style="--i:9">t</span></h1>
    <div class="bar"><i></i></div>
    <div class="cap dots" id="spCap">Bah, tchê! Entrando</div>
  </div>
</div>
<script>
// servidor gratuito dormindo: avisa que pode demorar (igual ao site)
setTimeout(function(){var c=document.getElementById('spCap');if(c)c.textContent='Acordando o servidor, tchê… pode levar um minutinho'},7000);
</script>
</body></html>
